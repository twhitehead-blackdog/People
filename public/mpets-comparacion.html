      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"

    />

        --bg-dark: #0f172a;
        --bg-card: #1e293b;
        --text-light: #f8fafc;
        --text-muted: #94a3b8;
        --border: #334155;
        --puppis-color: #6366f1;
        --blackdog-color: #22c55e;
        --match-color: #f59e0b;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Inter', sans-serif;
        background: var(--bg-dark);
        color: var(--text-light);
        min-height: 100vh;
      }
      .header {
        background: linear-gradient(135deg, var(--bg-card) 0%, #0f172a 100%);
        padding: 1.5rem;
        text-align: center;
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .header h1 {
        font-size: 1.75rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }
      .header h1 span:first-child {
        color: var(--puppis-color);
      }
      .header h1 span:last-child {
        color: var(--blackdog-color);
      }
      .controls {
        max-width: 1400px;
        margin: 1rem auto;
        padding: 0 1rem;
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        align-items: center;
      }
      .search-box {
        flex: 1;
        min-width: 200px;
        position: relative;
      }
      .search-box input {
        width: 100%;
        padding: 0.75rem 0.75rem 0.75rem 2.5rem;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-light);
        font-size: 0.875rem;
      }
      .search-box::before {
        content: '🔍';
        position: absolute;
        left: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
      }
      .filter-btns {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
      }
      .filter-btn {
        padding: 0.5rem 1rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-light);
        cursor: pointer;
        font-size: 0.8rem;
        transition: all 0.2s;
      }
      .filter-btn.active {
        background: var(--match-color);
        border-color: var(--match-color);
        color: #000;
      }
      .filter-btn:hover {
        border-color: var(--match-color);
      }
      .stats {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .stat-box {
        background: var(--bg-card);
        padding: 0.5rem 1rem;
        border-radius: 10px;
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .stat-box .number {
        font-size: 1.25rem;
        font-weight: 700;
      }
      .stat-box.matches .number {
        color: var(--match-color);
      }
      .stat-box.puppis .number {
        color: var(--puppis-color);
      }
      .stat-box.blackdog .number {
        color: var(--blackdog-color);
      }
      .stat-box .label {
        color: var(--text-muted);
        font-size: 0.7rem;
      }
      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 1rem;
      }
      .section-title {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 1.5rem 0 1rem;
        padding-bottom: 0.5rem;
        border-bottom: 2px solid;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .section-title.matches {
        border-color: var(--match-color);
        color: var(--match-color);
      }
      .section-title.puppis {
        border-color: var(--puppis-color);
        color: var(--puppis-color);
      }
      .section-title.blackdog {
        border-color: var(--blackdog-color);
        color: var(--blackdog-color);
      }
      .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
        gap: 1rem;
      }
      .match-card {
        background: var(--bg-card);
        border-radius: 12px;
        border: 2px solid var(--match-color);
        overflow: hidden;
      }
      .match-header {
        background: linear-gradient(
          135deg,
          rgba(245, 158, 11, 0.2) 0%,
          transparent 100%
        );
        padding: 0.75rem 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .match-name {
        font-weight: 600;
        font-size: 0.9rem;
      }
      .savings-badge {
        background: var(--match-color);
        color: #000;
        padding: 0.25rem 0.5rem;
        border-radius: 4px;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .match-body {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .store-side {
        padding: 0.75rem;
      }
      .store-side.puppis {
        background: rgba(99, 102, 241, 0.1);
        border-right: 1px solid var(--border);
      }
      .store-side.blackdog {
        background: rgba(34, 197, 94, 0.1);
      }
      .store-label {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 0.5rem;
      }

        color: var(--puppis-color);
      }
      .store-side.blackdog .store-label {
        color: var(--blackdog-color);
      }

        width: 60px;
        height: 60px;
        background: #fff;
        border-radius: 8px;
        margin-bottom: 0.5rem;
        overflow: hidden;
      }
      .store-img img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .store-price {
        font-size: 1.1rem;
        font-weight: 700;
      }
      .store-side.puppis .store-price {
        color: var(--puppis-color);
      }
      .store-side.blackdog .store-price {
        color: var(--blackdog-color);
      }
      .store-price-sub {
        font-size: 0.7rem;
        color: var(--text-muted);
      }
      .single-card {
        background: var(--bg-card);
        border-radius: 10px;
        border: 1px solid var(--border);
        padding: 0.75rem;
        display: flex;
        gap: 0.75rem;
        align-items: center;
      }
      .single-img {
        width: 60px;
        height: 60px;
        background: #fff;
        border-radius: 8px;
        overflow: hidden;
        flex-shrink: 0;
      }
      .single-img img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .single-info {
        flex: 1;
        min-width: 0;
      }
      .single-name {
        font-size: 0.85rem;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .single-price {
        font-size: 1rem;
        font-weight: 700;
        margin-top: 0.25rem;
      }
      .no-results {
        text-align: center;
        padding: 3rem;
        color: var(--text-muted);
      }

        .products-grid {
          grid-template-columns: 1fr;
        }
        .match-body {
          grid-template-columns: 1fr;
        }
        .store-side.puppis {
          border-right: none;
          border-bottom: 1px solid var(--border);
        }

      let currentFilter = 'all';
      function normalizeForMatch(name) {
        return name
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/m-pets|mpets|m pets/gi, '')
          .replace(/para perro|para gato|dog|cat/gi, '')
          .replace(/\s+/g, ' ')
          .trim();
      }
      function findMatches() {
        const matches = [];
        const usedBlackdog = new Set();
        puppisProducts.forEach((p) => {
          const pNorm = normalizeForMatch(p.name);
          let bestMatch = null,
            bestScore = 0;
          blackdogProducts.forEach((b, idx) => {
            if (usedBlackdog.has(idx)) return;
            const bNorm = normalizeForMatch(b.name);
            const pWords = pNorm.split(' ').filter((w) => w.length > 2);
            const bWords = bNorm.split(' ').filter((w) => w.length > 2);
            let matchingWords = 0;
            pWords.forEach((pw) => {
              if (bWords.some((bw) => bw.includes(pw) || pw.includes(bw)))
                matchingWords++;
            });
            const score = matchingWords / Math.max(pWords.length, 1);
            if (score > 0.5 && score > bestScore) {
              bestScore = score;
              bestMatch = { blackdog: b, idx, score };
            }
          });
          if (bestMatch) {
            usedBlackdog.add(bestMatch.idx);
            matches.push({
              puppis: p,
              blackdog: bestMatch.blackdog,
              score: bestMatch.score,
            });
          }
        });
        return matches;
      }
      const matches = findMatches();
      const matchedPuppisNames = new Set(matches.map((m) => m.puppis.name));
      const matchedBlackdogNames = new Set(matches.map((m) => m.blackdog.name));
      const puppisOnly = puppisProducts.filter(
        (p) => !matchedPuppisNames.has(p.name)
      );
      const blackdogOnly = blackdogProducts.filter(
        (b) => !matchedBlackdogNames.has(b.name)
      );
      function formatARS(n) {
        return n.toLocaleString('es-AR');
      }
      function formatUSD(n) {
        return n.toFixed(2);
      }
      function calculateUSD(ars) {
        return (ars / EXCHANGE_RATE).toFixed(2);
      }
      function renderMatches(data) {
        if (!data.length) return '';
        let html =
          '<h2 class="section-title matches">🔥 Productos Coincidentes (' +
          data.length +
          ')</h2><div class="products-grid">';
        data.forEach((m) => {
          const puppisUSD = parseFloat(calculateUSD(m.puppis.priceARS));
          const diff = m.blackdog.priceUSD - puppisUSD;
          const cheaper = diff > 0 ? 'Puppis' : 'Black Dog';
          const savings = Math.abs(diff).toFixed(2);
          html +=
            '<div class="match-card"><div class="match-header"><div class="match-name">' +
            m.puppis.name.substring(0, 50) +
            '</div><div class="savings-badge">' +
            (diff !== 0
              ? cheaper + ' $' + savings + ' USD más barato'
              : 'Mismo precio') +
            '</div></div><div class="match-body"><div class="store-side puppis"><div class="store-label">Puppis Argentina</div><div class="store-img"><img src="' +
            m.puppis.imageUrl +
            '" loading="lazy"></div><div class="store-price">$' +
            formatARS(m.puppis.priceARS) +
            ' ARS</div><div class="store-price-sub">≈ $' +
            puppisUSD +
            ' USD</div></div><div class="store-side blackdog"><div class="store-label">Black Dog Panamá</div><div class="store-img"><img src="' +
            m.blackdog.imageUrl +
            '" loading="lazy"></div><div class="store-price">$' +
            formatUSD(m.blackdog.priceUSD) +
            ' USD</div></div></div></div>';
        });
        return html + '</div>';
      }
      function renderSingle(data, store) {
        if (!data.length) return '';
        const label =
          store === 'puppis' ? 'Puppis Argentina' : 'Black Dog Panamá';
        let html =
          '<h2 class="section-title ' +
          store +
          '">' +
          (store === 'puppis' ? '🇦🇷' : '🇵🇦') +
          ' Solo en ' +
          label +
          ' (' +
          data.length +
          ')</h2><div class="products-grid" style="grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));">';
        data.forEach((p) => {
          const price =
            store === 'puppis'
              ? '$' + formatARS(p.priceARS) + ' ARS'
              : '$' + formatUSD(p.priceUSD) + ' USD';
          html +=
            '<div class="single-card"><div class="single-img"><img src="' +
            p.imageUrl +
            '" loading="lazy"></div><div class="single-info"><div class="single-name" title="' +
            p.name +
            '">' +
            p.name +
            '</div><div class="single-price" style="color: var(--' +
            store +
            '-color);">' +
            price +
            '</div></div></div>';
        });
        return html + '</div>';
      }
      function filterProducts() {
        const search = document
          .getElementById('searchInput')
          .value.toLowerCase();
        const filteredMatches = matches.filter(
          (m) =>
            m.puppis.name.toLowerCase().includes(search) ||
            m.blackdog.name.toLowerCase().includes(search)
        );
        const filteredPuppis = puppisOnly.filter((p) =>
          p.name.toLowerCase().includes(search)
        );
        const filteredBlackdog = blackdogOnly.filter((b) =>
          b.name.toLowerCase().includes(search)
        );
        document.getElementById('matchCount').textContent =
          filteredMatches.length;
        document.getElementById('puppisCount').textContent =
          filteredPuppis.length;
        document.getElementById('blackdogCount').textContent =
          filteredBlackdog.length;
        const showMatches =
          currentFilter === 'all' || currentFilter === 'matches';
        const showPuppis =
          currentFilter === 'all' || currentFilter === 'puppis';
        const showBlackdog =
          currentFilter === 'all' || currentFilter === 'blackdog';
        document.getElementById('matchesSection').innerHTML = showMatches
          ? renderMatches(filteredMatches)
          : '';
        document.getElementById('puppisSection').innerHTML = showPuppis
          ? renderSingle(filteredPuppis, 'puppis')
          : '';
        document.getElementById('blackdogSection').innerHTML = showBlackdog
          ? renderSingle(filteredBlackdog, 'blackdog')
          : '';
        const hasResults =
          (showMatches && filteredMatches.length) ||
          (showPuppis && filteredPuppis.length) ||
          (showBlackdog && filteredBlackdog.length);
        document.getElementById('noResults').style.display = hasResults
          ? 'none'
          : 'block';
      }
      function setFilter(f) {
        currentFilter = f;
        document
          .querySelectorAll('.filter-btn')
          .forEach((b) => b.classList.toggle('active', b.dataset.filter === f));
        filterProducts();
      }
      document.addEventListener('DOMContentLoaded', filterProducts);
