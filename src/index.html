<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>People | Registro de Empleados</title>
    <base href="/" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <link href="favicon.ico" rel="icon" type="image/x-icon" />
    <!-- Google Fonts para tema Naz -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Forzar modo oscuro siempre
      document.documentElement.classList.add('dark');
      // Prevenir cambios de tema
      if (window.matchMedia) {
        const darkModeMediaQuery = window.matchMedia('(prefers-color-scheme: light)');
        darkModeMediaQuery.addEventListener('change', () => {
          document.documentElement.classList.add('dark');
        });
      }

      // Interceptar y filtrar logs de XHR y URLs de base de datos en producción
      (function() {
        const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        
        // Guardar las funciones originales
        const originalLog = console.log;
        const originalWarn = console.warn;
        const originalError = console.error;
        
        // Patrones a filtrar (URLs de base de datos, XHR logs, etc.)
        const sensitivePatterns = [
          /XHR finished loading/i,
          /supabase\.co/i,
          /rest\/v1\//i,
          /companies\?select/i,
          /positions\?select/i,
          /settings\?select/i,
          /company_id=eq\./i,
        ];
        
        // Función para verificar si un mensaje contiene información sensible
        function containsSensitiveInfo(...args) {
          const message = args.join(' ');
          return sensitivePatterns.some(pattern => pattern.test(message));
        }
        
        // Sobrescribir console.log
        console.log = function(...args) {
          if (!isLocalhost && containsSensitiveInfo(...args)) {
            return; // No mostrar en producción
          }
          originalLog.apply(console, args);
        };
        
        // Sobrescribir console.warn
        console.warn = function(...args) {
          if (!isLocalhost && containsSensitiveInfo(...args)) {
            return; // No mostrar en producción
          }
          originalWarn.apply(console, args);
        };
        
        // Sobrescribir console.error (mantener errores pero sin detalles sensibles)
        console.error = function(...args) {
          if (!isLocalhost && containsSensitiveInfo(...args)) {
            // En producción, solo mostrar un mensaje genérico
            originalError.apply(console, ['[Error]']);
            return;
          }
          originalError.apply(console, args);
        };
      })();
    </script>
  </head>
  <body class="dark">
    <pt-root></pt-root>
  </body>
</html>
