<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <title>People | Registro de Empleados</title>
    <base href="/" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <link href="favicon.ico" rel="icon" type="image/x-icon" />
    <!-- Google Fonts para tema Naz -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Forzar modo oscuro siempre
      document.documentElement.classList.add('dark');
      // Prevenir cambios de tema
      if (window.matchMedia) {
        const darkModeMediaQuery = window.matchMedia('(prefers-color-scheme: light)');
        darkModeMediaQuery.addEventListener('change', () => {
          document.documentElement.classList.add('dark');
        });
      }
    </script>
  </head>
  <body class="dark">
    <pt-root></pt-root>
  </body>
</html>
