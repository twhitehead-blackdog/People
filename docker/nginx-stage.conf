# ============================================
# Configuración Nginx - STAGING
# ============================================
# Para usar en el servidor Hostinger
# ============================================

server {
    listen 80;
    server_name stage.people.blackdogpanama.com;

    # Redirección a HTTPS (descomentar después de configurar SSL)
    # return 301 https://$server_name$request_uri;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support (si es necesario)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Healthcheck
    location /health {
        proxy_pass http://127.0.0.1:18080/health;
        access_log off;
    }
}

