# ============================================
# Nginx - Versión de PRUEBA
# prueba.people.blackdogpanama.com → backend en 3001
# ============================================
# Copiar a /etc/nginx/sites-available/ y enlazar en sites-enabled.
# Certificado SSL: sudo certbot --nginx -d prueba.people.blackdogpanama.com
# ============================================

server {
    listen 80;
    server_name prueba.people.blackdogpanama.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name prueba.people.blackdogpanama.com;

    ssl_certificate /etc/letsencrypt/live/prueba.people.blackdogpanama.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prueba.people.blackdogpanama.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:3001/health;
        access_log off;
    }
}

