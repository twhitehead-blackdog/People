version: '3.9'

services:
  traefik:
    image: 'traefik'
    restart: always
    command:
      - '--api=true'
      - '--api.dashboard=true'
      - '--api.insecure=false'
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.web.http.redirections.entryPoint.to=websecure'
      - '--entrypoints.web.http.redirections.entrypoint.scheme=https'
      - '--entrypoints.websecure.address=:443'
      - '--certificatesresolvers.mytlschallenge.acme.tlschallenge=true'
      - '--certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}'
      - '--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik-dashboard.rule=Host(`traefik.blackdogpanama.com`) || Host(`dashboard.blackdogpanama.com`)
      - traefik.http.routers.traefik-dashboard.entrypoints=websecure
      - traefik.http.routers.traefik-dashboard.tls=true
      - traefik.http.routers.traefik-dashboard.tls.certresolver=mytlschallenge
      - traefik.http.routers.traefik-dashboard.service=api@internal

  postgres:
    image: postgres:15
    container_name: postgres_n8n
    restart: always
    environment:
      POSTGRES_USER: n8n_user
      POSTGRES_PASSWORD: superclave123
      POSTGRES_DB: memoria_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    ports:
      - '127.0.0.1:5678:5678'
    expose:
      - '5678'
    depends_on:
      - postgres
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host("${SUBDOMAIN}.${DOMAIN_NAME}")
      - traefik.http.routers.n8n.entrypoints=websecure
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.tls.certresolver=mytlschallenge
      - traefik.http.middlewares.n8n.headers.SSLRedirect=true
      - traefik.http.middlewares.n8n.headers.STSSeconds=315360000
      - traefik.http.middlewares.n8n.headers.browserXSSFilter=true
      - traefik.http.middlewares.n8n.headers.contentTypeNosniff=true
      - traefik.http.middlewares.n8n.headers.forceSTSHeader=true
      - traefik.http.middlewares.n8n.headers.SSLHost=${DOMAIN_NAME}
      - traefik.http.middlewares.n8n.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.n8n.headers.STSPreload=true
      - traefik.http.routers.n8n.middlewares=n8n@docker
    environment:
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_EDITOR_BASE_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - NODE_ENV=production
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=memoria_ai
      - DB_POSTGRESDB_USER=n8n_user
      - DB_POSTGRESDB_PASSWORD=superclave123
    volumes:
      - n8n_data:/home/node/.n8n
      - /local-files:/files

  bladri:
    build: ./bladri
    restart: always
    expose:
      - 8080
    labels:
      - traefik.enable=true
      - traefik.http.routers.bladri.rule=Host("bladri.blackdogpanama.com")
      - traefik.http.routers.bladri.entrypoints=websecure
      - traefik.http.routers.bladri.tls=true
      - traefik.http.routers.bladri.tls.certresolver=mytlschallenge

  waha:
    image: devlikeapro/waha:latest
    container_name: waha
    restart: always
    environment:
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_DASHBOARD_USERNAME=${WAHA_USER}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_PASS}
    expose:
      - 3000
    labels:
      - traefik.enable=true
      - traefik.http.routers.waha.rule=Host("${WAHA_SUBDOMAIN}.${DOMAIN_NAME}")
      - traefik.http.routers.waha.entrypoints=websecure
      - traefik.http.routers.waha.tls=true
      - traefik.http.routers.waha.tls.certresolver=mytlschallenge

  people:
    image: nginx:alpine
    container_name: people-proxy
    restart: always
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - /root/nginx/people.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.people.rule=Host(`people.blackdogpanama.com`)
      - traefik.http.routers.people.priority=100
      - traefik.http.routers.people.entrypoints=websecure
      - traefik.http.routers.people.tls=true
      - traefik.http.routers.people.tls.certresolver=mytlschallenge
      - traefik.http.services.people.loadbalancer.server.port=80

volumes:
  traefik_data:
    external: true
  n8n_data:
    external: true
  postgres_data:
